<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOSS — Find the right plant for your space</title>

  <style>
    html {
      background-color: #f5f4ee;
    }

    html[data-theme="dark"] {
      background-color: #111815;
    }
  </style>
  <script>
    (() => {
      const saved = localStorage.getItem("moss-theme");
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      const theme =
        saved === "light" || saved === "dark"
          ? saved
          : systemDark
            ? "dark"
            : "light";

      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
